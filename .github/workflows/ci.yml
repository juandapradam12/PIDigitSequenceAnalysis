name: CI

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Count patterns
        run: make run

      - name: Partition benchmark
        run: make benchmark

      - name: Analyze
        run: make analyze

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
